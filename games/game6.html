<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Bowl - Cheeseball Games</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <h1 class="logo">🧀 Cheeseball Games</h1>
    </nav>

    <main class="container">
        <a href="../index.html" class="back-btn">← Back to Home</a>
        
        <h2>Retro Bowl</h2>
        
        <!-- PASTE YOUR GAME CODE HERE -->
     <iframe data-lazyloaded="1"  
         src="https://retrobowl.me/iframe/retro-bowl/latest.html" 
         loading="lazy" 
         title="Play Retro Bowl" 
         id="myFrame" 
         class="game-iframe entered litespeed-loaded" 
         data-litespeed-src="https://retrobowl.me/iframe/retro-bowl/latest.html" 
         width="100%" height="600" 
         frameborder="0" 
         scrolling="no" 
         allowfullscreen="allowfullscreen" 
         data-ll-status="loaded">
         </iframe>
        <!-- END GAME CODE -->
        <button class="btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>

<script>
  function toggleFullscreen() {
    const iframe = document.getElementById('myFrame');
    if (!document.fullscreenElement) {
      iframe.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }
</script>

    </main>

    </footer>
</body>
</html>
